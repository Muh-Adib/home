version: '3.8'

services:
  # Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=${APP_URL:-http://localhost:8080}
      
      # External MySQL Configuration
      - DB_HOST=homsjogja-db-xsjalx
      - DB_PORT=3306
      - DB_DATABASE=homs-db
      - DB_USERNAME=homs-user
      - DB_PASSWORD=jD8-AKHx2gFCQ5gx3ouRJ
      
      # External Redis Configuration
      - REDIS_HOST=homsjogja-redis-qmihbb
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5vlcwpzc45g9mtho
      - REDIS_DB=0
      
      # Broadcasting Configuration
      - BROADCAST_DRIVER=redis
      - BROADCAST_CONNECTION=default
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
      - QUEUE_CONNECTION=redis
      
      # WebSocket Configuration
      - SOCKETIO_PORT=6001
      - SOCKETIO_HOST=0.0.0.0
      
      # Notification Configuration
      - NOTIFICATION_CHANNELS=database,broadcast
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/storage/app/public
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Laravel Echo Server untuk WebSocket
  websocket:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "6001:6001"
    environment:
      - REDIS_HOST=homsjogja-redis-qmihbb
      - REDIS_PORT=6379
      - REDIS_PASSWORD=5vlcwpzc45g9mtho
      - REDIS_DB=0
      - AUTH_HOST=http://app:80
      - AUTH_ENDPOINT=/broadcasting/auth
    volumes:
      - ./laravel-echo-server.dokploy.json:/app/laravel-echo-server.json:ro
    networks:
      - app_network
    restart: unless-stopped
    depends_on:
      - app
    command: >
      sh -c "
        npm install -g laravel-echo-server &&
        laravel-echo-server start --config=/app/laravel-echo-server.json
      "
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:6001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  app_storage:
    driver: local
  app_uploads:
    driver: local

networks:
  app_network:
    driver: bridge
