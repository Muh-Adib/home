[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=100

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=200

[program:laravel-echo-server]
command=laravel-echo-server start --config=/var/www/html/laravel-echo-server.dokploy.json
directory=/var/www/html
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/var/log/laravel-echo-server.log
stderr_logfile=/var/log/laravel-echo-server.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=300
user=www

[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/queue-worker.log
stderr_logfile=/var/log/queue-worker.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=400
user=www

[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
autostart=true
autorestart=true
startretries=5
startsecs=5
stdout_logfile=/var/log/scheduler.log
stderr_logfile=/var/log/scheduler.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=500
user=www

[program:health-monitor]
command=/bin/sh -c "sleep 30 && while [ true ]; do echo 'Testing main app health...' && curl -f http://localhost:80/health >/dev/null 2>&1 && echo 'Main app health check passed' || echo 'Main app health check failed'; echo 'Container ID: ' \$(hostname); echo 'Timestamp: ' \$(date); sleep 30; done"
autostart=true
autorestart=true
startretries=3
startsecs=10
stdout_logfile=/var/log/health-monitor.log
stderr_logfile=/var/log/health-monitor.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=600

[eventlistener:processes]
command=bash -c "echo 'Supervisor started' && echo 'Container ID: ' \$(hostname) && echo 'Timestamp: ' \$(date) && echo 'Services: nginx, php-fpm, laravel-echo-server, queue-worker, scheduler, health-monitor'"
events=PROCESS_STATE
autostart=true
autorestart=false
startretries=1
stdout_logfile=/var/log/supervisor-events.log
stderr_logfile=/var/log/supervisor-events.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0