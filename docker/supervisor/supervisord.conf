[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
directory=/var/www/html

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
autostart=true
autorestart=true
priority=5
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=root
startsecs=10
stopwaitsecs=30
environment=HOME="/var/www/html"
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=root
startsecs=5
stopwaitsecs=10
redirect_stderr=true

[program:laravel-echo-server]
command=laravel-echo-server start --config=/var/www/html/laravel-echo-server.dokploy.json
directory=/var/www/html
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/echo-server.log
stderr_logfile=/var/log/supervisor/echo-server_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
user=www
startsecs=10
stopwaitsecs=30
redirect_stderr=true
environment=HOME="/var/www/html"

[program:queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-jobs=1000
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stopwaitsecs=60
startsecs=10
environment=HOME="/var/www/html"

[program:schedule]
command=/bin/sh -c "while [ true ]; do (php /var/www/html/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/var/log/supervisor/schedule.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/var/www/html"

[program:health-check]
command=/bin/sh -c "while [ true ]; do curl -f http://localhost/health >/dev/null 2>&1 || echo 'Health check failed'; sleep 30; done"
directory=/var/www/html
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/var/log/supervisor/health-check.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
startsecs=30
environment=HOME="/var/www/html"

[program:websocket-health-check]
command=bash -c "while true; do if curl -f -s http://localhost:6002 >/dev/null 2>&1; then echo 'WebSocket health check passed'; else echo 'WebSocket health check failed'; fi; sleep 30; done"
directory=/var/www/html
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/supervisor/websocket-health-check.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=3
startsecs=45
environment=HOME="/var/www/html"

[program:log-cleanup]
command=/bin/sh -c "while [ true ]; do find /var/log/supervisor -name '*.log' -size +50M -exec truncate -s 50M {} \; 2>/dev/null || true; sleep 3600; done"
directory=/var/www/html
autostart=true
autorestart=true
user=root
redirect_stderr=true
stdout_logfile=/var/log/supervisor/log-cleanup.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
startsecs=5
environment=HOME="/var/www/html"

[group:laravel]
programs=queue-worker,schedule
priority=999 