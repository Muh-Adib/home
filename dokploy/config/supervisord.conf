[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

# Nginx Web Server
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=100
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

# PHP-FPM
[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=200
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10

# Laravel Queue Worker
[program:laravel-queue]
command=php /app/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=300
user=www-data
stdout_logfile=/var/log/supervisor/laravel-queue.log
stderr_logfile=/var/log/supervisor/laravel-queue-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=HOME="/home/www-data"

# WebSocket Server (Laravel Echo Server)
[program:websocket]
command=laravel-echo-server start --config=/app/laravel-echo-server.json
autostart=true
autorestart=true
startretries=3
startsecs=5
priority=400
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket-error.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile_backups=10
environment=NODE_ENV="production"

# Event listeners
[eventlistener:processes]
command=bash -c "echo_supervisord_conf; echo '[program:nginx]'; echo 'command=nginx -g \"daemon off;\"'; echo 'autostart=true'; echo 'autorestart=true'; echo 'startretries=3'; echo 'startsecs=5'; echo 'priority=100'; echo 'stdout_logfile=/var/log/supervisor/nginx.log'; echo 'stderr_logfile=/var/log/supervisor/nginx-error.log'; echo 'stdout_logfile_maxbytes=50MB'; echo 'stderr_logfile_maxbytes=50MB'; echo 'stdout_logfile_backups=10'; echo 'stderr_logfile_backups=10'; echo ''; echo '[program:php-fpm]'; echo 'command=php-fpm -F'; echo 'autostart=true'; echo 'autorestart=true'; echo 'startretries=3'; echo 'startsecs=5'; echo 'priority=200'; echo 'stdout_logfile=/var/log/supervisor/php-fpm.log'; echo 'stderr_logfile=/var/log/supervisor/php-fpm-error.log'; echo 'stdout_logfile_maxbytes=50MB'; echo 'stderr_logfile_maxbytes=50MB'; echo 'stdout_logfile_backups=10'; echo 'stderr_logfile_backups=10'; echo ''; echo '[program:laravel-queue]'; echo 'command=php /app/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600'; echo 'autostart=true'; echo 'autorestart=true'; echo 'startretries=3'; echo 'startsecs=5'; echo 'priority=300'; echo 'user=www-data'; echo 'stdout_logfile=/var/log/supervisor/laravel-queue.log'; echo 'stderr_logfile=/var/log/supervisor/laravel-queue-error.log'; echo 'stdout_logfile_maxbytes=50MB'; echo 'stderr_logfile_maxbytes=50MB'; echo 'stdout_logfile_backups=10'; echo 'stderr_logfile_backups=10'; echo 'environment=HOME=\"/home/www-data\"'; echo ''; echo '[program:websocket]'; echo 'command=laravel-echo-server start --config=/app/laravel-echo-server.json'; echo 'autostart=true'; echo 'autorestart=true'; echo 'startretries=3'; echo 'startsecs=5'; echo 'priority=400'; echo 'stdout_logfile=/var/log/supervisor/websocket.log'; echo 'stderr_logfile=/var/log/supervisor/websocket-error.log'; echo 'stdout_logfile_maxbytes=50MB'; echo 'stderr_logfile_maxbytes=50MB'; echo 'stdout_logfile_backups=10'; echo 'stderr_logfile_backups=10'; echo 'environment=NODE_ENV=\"production\"'"
events=PROCESS_STATE_STOPPED,PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
