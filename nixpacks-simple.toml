[phases.setup]
nixPkgs = [
    "php82", 
    "php82Packages.composer",
    "php82Packages.pdo_mysql",
    "php82Packages.redis",
    "php82Packages.gd",
    "php82Packages.mbstring",
    "php82Packages.exif",
    "php82Packages.pcntl",
    "php82Packages.bcmath",
    "php82Packages.zip",
    "php82Packages.intl",
    "php82Packages.opcache",
    "nodejs_20",
    "nginx",
    "supervisor",
    "curl",
    "netcat",
    "procps",
    "sqlite",
    "pkg-config"
]

[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction --no-progress --prefer-dist",
    "composer dump-autoload --optimize",
    "npm install",
    "npm run build"
]

[phases.build]
cmds = [
    "php artisan key:generate --force || echo 'Key generation skipped'",
    "php artisan storage:link || echo 'Storage link failed, continuing...'",
    "php artisan config:cache",
    "php artisan route:cache", 
    "php artisan view:cache"
]

[start]
cmd = "/usr/local/bin/startup.sh"

[variables]
PHP_FPM_USER = "root"
PHP_FPM_GROUP = "root"
NGINX_PORT = "8080"
ECHO_SERVER_PORT = "6002"
DEBUG_MODE = "true"
LOG_LEVEL = "debug" 