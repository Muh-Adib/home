[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=true
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=100
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx_error.log
user=root

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
priority=200
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm_error.log
user=root

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
priority=300
stdout_logfile=/var/log/supervisor/laravel-queue.log
stderr_logfile=/var/log/supervisor/laravel-queue_error.log
user=www-data
directory=/var/www/html
environment=HOME="/var/www/html"

[program:websocket-server]
command=laravel-echo-server start --config=/var/www/html/laravel-echo-server.dokploy.json
autostart=true
autorestart=true
priority=400
stdout_logfile=/var/log/supervisor/websocket.log
stderr_logfile=/var/log/supervisor/websocket_error.log
user=www-data
directory=/var/www/html
environment=HOME="/var/www/html",NODE_ENV="production"

[group:laravel-app]
programs=nginx,php-fpm,laravel-queue,websocket-server
priority=999
