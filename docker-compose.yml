services:
  # Single Container for Dokploy Deployment
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-app
    restart: unless-stopped
    ports:
      - "8080:8080"  # Main application port
      - "6002:6002"  # WebSocket port
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
      - ./public:/var/www/html/public
    environment:
      - APP_NAME=${APP_NAME:-Laravel}
      - APP_ENV=${APP_ENV:-production}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8080}
      - APP_LOCALE=${APP_LOCALE:-en}
      - APP_FALLBACK_LOCALE=${APP_FALLBACK_LOCALE:-en}
      - APP_FAKER_LOCALE=${APP_FAKER_LOCALE:-en_US}
      - APP_MAINTENANCE_DRIVER=${APP_MAINTENANCE_DRIVER:-file}
      - PHP_CLI_SERVER_WORKERS=${PHP_CLI_SERVER_WORKERS:-1}
      - BCRYPT_ROUNDS=${BCRYPT_ROUNDS:-10}
      - LOG_CHANNEL=${LOG_CHANNEL:-stack}
      - LOG_STACK=${LOG_STACK:-single}
      - LOG_DEPRECATIONS_CHANNEL=${LOG_DEPRECATIONS_CHANNEL:-null}
      - LOG_LEVEL=${LOG_LEVEL:-debug}
      - DB_CONNECTION=${DB_CONNECTION:-mysql}
      - DB_HOST=${DB_HOST:-127.0.0.1}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-property_management}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - SESSION_DRIVER=${SESSION_DRIVER:-file}
      - SESSION_LIFETIME=${SESSION_LIFETIME:-120}
      - SESSION_ENCRYPT=${SESSION_ENCRYPT:-false}
      - SESSION_PATH=${SESSION_PATH:-/}
      - SESSION_DOMAIN=${SESSION_DOMAIN:-null}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-sync}
      - CACHE_DRIVER=${CACHE_DRIVER:-file}
      - CACHE_STORE=${CACHE_STORE:-file}
      - REDIS_CLIENT=${REDIS_CLIENT:-phpredis}
      - REDIS_HOST=${REDIS_HOST:-127.0.0.1}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-null}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-null}
      - REDIS_URL=${REDIS_URL}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK:-local}
      - BROADCAST_CONNECTION=${BROADCAST_CONNECTION:-log}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_SCHEME=${MAIL_SCHEME:-tls}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-null}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-null}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-hello@example.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-"${APP_NAME}"}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - AWS_BUCKET=${AWS_BUCKET}
      - AWS_USE_PATH_STYLE_ENDPOINT=${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      - VITE_APP_NAME=${VITE_APP_NAME:-"${APP_NAME}"}
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ["/usr/local/bin/startup.sh"]

networks:
  homsjogja-network:
    driver: bridge

volumes:
  storage:
    driver: local
  cache:
    driver: local 