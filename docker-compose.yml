services:
  # Main Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_NAME=$APP_NAME
      - APP_ENV=$APP_ENV
      - APP_KEY=$APP_KEY
      - APP_DEBUG=$APP_DEBUG
      - APP_URL=$APP_URL
      - APP_LOCALE=$APP_LOCALE
      - APP_FALLBACK_LOCALE=$APP_FALLBACK_LOCALE
      - APP_FAKER_LOCALE=$APP_FAKER_LOCALE
      - APP_MAINTENANCE_DRIVER=$APP_MAINTENANCE_DRIVER
      - PHP_CLI_SERVER_WORKERS=$PHP_CLI_SERVER_WORKERS
      - BCRYPT_ROUNDS=$BCRYPT_ROUNDS
      - LOG_CHANNEL=$LOG_CHANNEL
      - LOG_STACK=$LOG_STACK
      - LOG_DEPRECATIONS_CHANNEL=$LOG_DEPRECATIONS_CHANNEL
      - LOG_LEVEL=$LOG_LEVEL
      - DB_CONNECTION=$DB_CONNECTION
      - DB_HOST=$DB_HOST
      - DB_PORT=$DB_PORT
      - DB_DATABASE=$DB_DATABASE
      - DB_USERNAME=$DB_USERNAME
      - DB_PASSWORD=$DB_PASSWORD
      - SESSION_DRIVER=$SESSION_DRIVER
      - SESSION_LIFETIME=$SESSION_LIFETIME
      - SESSION_ENCRYPT=$SESSION_ENCRYPT
      - SESSION_PATH=$SESSION_PATH
      - SESSION_DOMAIN=$SESSION_DOMAIN
      - QUEUE_CONNECTION=$QUEUE_CONNECTION
      - CACHE_DRIVER=$CACHE_DRIVER
      - CACHE_STORE=$CACHE_STORE
      - REDIS_CLIENT=$REDIS_CLIENT
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - REDIS_USERNAME=$REDIS_USERNAME
      - REDIS_PASSWORD=$REDIS_PASSWORD
      - REDIS_URL=$REDIS_URL
      - FILESYSTEM_DISK=$FILESYSTEM_DISK
      - BROADCAST_CONNECTION=$BROADCAST_CONNECTION
      - MAIL_MAILER=$MAIL_MAILER
      - MAIL_SCHEME=$MAIL_SCHEME
      - MAIL_HOST=$MAIL_HOST
      - MAIL_PORT=$MAIL_PORT
      - MAIL_USERNAME=$MAIL_USERNAME
      - MAIL_PASSWORD=$MAIL_PASSWORD
      - MAIL_FROM_ADDRESS=$MAIL_FROM_ADDRESS
      - MAIL_FROM_NAME=$MAIL_FROM_NAME
      - AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
      - AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION
      - AWS_BUCKET=$AWS_BUCKET
      - AWS_USE_PATH_STYLE_ENDPOINT=$AWS_USE_PATH_STYLE_ENDPOINT
      - VITE_APP_NAME=$VITE_APP_NAME
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Service (separate from app for Dokploy)
  nginx:
    image: nginx:alpine
    container_name: homsjogja-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/dokploy.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PHP-FPM Service (separate from app for Dokploy)
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-php-fpm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    command: ["/usr/local/sbin/php-fpm", "--nodaemonize"]
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Laravel Echo Server (WebSocket)
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-websocket
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel-echo-server.dokploy.json:/var/www/html/laravel-echo-server.dokploy.json
    environment:
      - APP_ENV=production
    command: ["laravel-echo-server", "start", "--config=/var/www/html/laravel-echo-server.dokploy.json"]
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/socket.io/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - app
    networks:
      - homsjogja-network

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
    networks:
      - homsjogja-network

networks:
  homsjogja-network:
    driver: bridge

volumes:
  storage:
    driver: local
  cache:
    driver: local 