version: '3.8'

services:
  # Main Laravel Application
  app:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    ports:
      - "3000:8080"
      - "6002:6002"
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Service (separate from app for Dokploy)
  nginx:
    image: nginx:alpine
    container_name: homsjogja-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/dokploy.conf:/etc/nginx/conf.d/default.conf
      - ./public:/var/www/html/public
      - ./storage:/var/www/html/storage
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # PHP-FPM Service (separate from app for Dokploy)
  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-php-fpm
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    command: ["/usr/local/sbin/php-fpm", "--nodaemonize"]
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Laravel Echo Server (WebSocket)
  websocket:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-websocket
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./laravel-echo-server.dokploy.json:/var/www/html/laravel-echo-server.dokploy.json
    environment:
      - APP_ENV=production
    command: ["laravel-echo-server", "start", "--config=/var/www/html/laravel-echo-server.dokploy.json"]
    depends_on:
      - app
    networks:
      - homsjogja-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6002/socket.io/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Queue Worker
  queue:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - app
    networks:
      - homsjogja-network

  # Scheduler
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.dokploy
    container_name: homsjogja-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./storage:/var/www/html/storage
    environment:
      - APP_ENV=production
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - app
    networks:
      - homsjogja-network

networks:
  homsjogja-network:
    driver: bridge

volumes:
  storage:
    driver: local
  cache:
    driver: local 